name: Auto Backup Code to Feiniu NAS (远程访问版)
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 19 * * *'  # 北京时间凌晨3点自动备份

permissions:
  contents: read

jobs:
  backup-to-nas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lftp (SFTP client)
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Compress code to ZIP
        run: |
          ZIP_NAME="backup_${{ github.repository_name }}_$(date +%Y%m%d_%H%M%S).zip"
          zip -r $ZIP_NAME ./*
          echo "ZIP_FILE=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload to Feiniu NAS via SFTP (远程访问)
        run: |
          lftp -c "
          set sftp:port ${{ secrets.NAS_PORT }};
          set ftp:ssl-allow no;
          set net:timeout 30;
          set net:max-retries 3;
          open sftp://${{ secrets.NAS_USERNAME }}:${{ secrets.NAS_PASSWORD }}@${{ secrets.NAS_HOST }};
          mkdir -p ${{ secrets.NAS_BACKUP_PATH }};
          cd ${{ secrets.NAS_BACKUP_PATH }};
          put ${{ env.ZIP_FILE }};
          bye
          "

      - name: Backup success
        run: echo "✅ 代码已备份到飞牛NAS（远程访问）：${{ secrets.NAS_BACKUP_PATH }}/${{ env.ZIP_FILE }}"
